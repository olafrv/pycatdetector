services:
  pycatdetector:
    build: .
    # Built and tagged locally by `make docker.build` (never pulled/pushed)
    image: pycatdetector:latest
    container_name: pycatdetector
    environment:
      - TZ=Europe/Berlin
      # Also set in the Dockerfile; kept here so images built before the
      # non-root change find the models at the new mount path too.
      - TORCH_HOME=/opt/pycatdetector/models
      # Used for debugging OpenCV issues with versions upgrade
      # Uncomment the following lines to enable detailed OpenCV logging
      # Modify also the Recorder.py to pick up OpenCV debugging options
      # https://github.com/opencv/opencv/issues/27091 (Bug)
      # - OPENCV_LOG_LEVEL=DEBUG
      # - OPENCV_VIDEOIO_DEBUG=1
    volumes:
    - ./config.yaml:/opt/pycatdetector/config.yaml:ro
    - ./logs:/opt/pycatdetector/logs:rw
    - ./videos:/opt/pycatdetector/videos:rw
    - ./models:/opt/pycatdetector/models:rw
    restart: always
    # Run as uid/gid 1000 (owner of the mounted dirs). Also set by USER in the
    # Dockerfile; repeated here so older root-based images run non-root too.
    # Needed with cap_drop ALL: root without CAP_DAC_OVERRIDE can't write them.
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Detector needs a few seconds to close the current video on shutdown.
    stop_grace_period: 30s
    deploy:
        resources:
            limits:
              memory: 1024M
            reservations:
              memory: 512M

